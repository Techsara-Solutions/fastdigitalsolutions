# Main nginx configuration for the Fast Digital Solutions static site host.
#
# This REPLACES the distribution default. The stock file (both on Amazon Linux
# and Ubuntu) ships its own `server { listen 80; ... }` block serving a
# placeholder page. Because two default server blocks on the same port are
# ambiguous, that block is removed here and the site's own block in
# conf.d/fastdigitalsolutions.conf becomes the single, explicit default.
#
# deploy/setup-ec2.sh backs the original up to /etc/nginx/nginx.conf.distro-orig
# before installing this file, and substitutes the correct worker user.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

# Dynamic modules shipped by the distribution.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compression (PRD §27.4). Declared once here rather than per server block.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml application/rss+xml;

    # Site server blocks live here. No server block is defined in this file.
    include /etc/nginx/conf.d/*.conf;
}

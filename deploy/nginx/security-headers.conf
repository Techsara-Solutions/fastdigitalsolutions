# Security response headers (PRD §23.6), installed to /etc/nginx/security-headers.conf.
#
# IMPORTANT nginx behaviour: `add_header` directives are inherited by a nested
# block ONLY while that block declares no add_header of its own. As soon as a
# location sets any header (for example Cache-Control), it loses every inherited
# one. That is why this file is `include`d explicitly in each location block
# rather than being declared once at server level and relied upon to cascade.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options "DENY" always;

# Content-Security-Policy: a static Next.js export needs inline script/style for
# hydration bootstrapping. connect-src lists the contact API origin (API Gateway,
# see siteConfig.contactApiUrl) so the browser may POST the enquiry form to it.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://9jdb11lm21.execute-api.us-east-1.amazonaws.com" always;

# HSTS must only ever be sent over HTTPS. deploy/setup-ec2.sh --enable-hsts
# uncomments this line, and that should only be run after TLS is active.
#add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

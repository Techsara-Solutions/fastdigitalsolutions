# Site server blocks for the Fast Digital Solutions static export.
# Installed to /etc/nginx/conf.d/fastdigitalsolutions.conf by deploy/setup-ec2.sh.
#
# The site sits behind Cloudflare, which terminates TLS for visitors and then
# connects to this origin. With Cloudflare's SSL/TLS mode set to Full or
# Full (Strict) that origin connection is HTTPS on port 443 — so port 443 must
# answer, or Cloudflare returns "Error 521: Web server is down".

# ----------------------------------------------------------------- HTTP (80)
#
# Deliberately serves the site rather than redirecting to HTTPS:
#   - the deployment health check runs `curl http://127.0.0.1/` on the instance
#   - Cloudflare, not the origin, owns the visitor-facing HTTP→HTTPS redirect
#     (SSL/TLS → Edge Certificates → Always Use HTTPS)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name fastdigitalsolutions.com www.fastdigitalsolutions.com _;

    include /etc/nginx/site-locations.conf;
}

# ---------------------------------------------------------------- HTTPS (443)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name fastdigitalsolutions.com www.fastdigitalsolutions.com _;

    # Cloudflare Origin Certificate (valid until 2041). It is trusted by
    # Cloudflare only, not by browsers directly — which is correct, because
    # Cloudflare is the only client that ever connects to this origin. Visitors
    # see Cloudflare's own publicly-trusted certificate instead.
    ssl_certificate     /etc/ssl/certs/fastdigitalsolutions.origin.pem;
    ssl_certificate_key /etc/ssl/private/fastdigitalsolutions.origin.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    include /etc/nginx/site-locations.conf;
}

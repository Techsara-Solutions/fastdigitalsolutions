# Nginx server block for the Fast Digital Solutions static site.
# Install to /etc/nginx/sites-available/fastdigitalsolutions and symlink into
# sites-enabled (deploy/setup-ec2.sh does this). See docs/DEPLOYMENT.md.
#
# TLS: once the production domain exists, run certbot --nginx; it rewrites this
# file for 443 and adds the HTTP→HTTPS redirect. After TLS is active, uncomment
# the Strict-Transport-Security header below (HSTS must only ship over HTTPS).

server {
    listen 80;
    listen [::]:80;

    # Replace with the production domain when it exists (see docs/DEPLOYMENT.md).
    server_name _;

    root /var/www/fastdigitalsolutions/current;
    index index.html;

    # ---- Security headers (PRD §23.6, adapted for Nginx) ----
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # enable after TLS
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    # Static Next.js exports require inline scripts/styles; when the contact
    # API goes live, add its origin to connect-src and form-action.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # ---- Caching ----
    # Fingerprinted build assets: cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Self-hosted fonts (fingerprinted by the build).
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML must revalidate so deployments take effect immediately.
    location / {
        add_header Cache-Control "no-cache";
        # Re-declare security headers: nginx add_header directives from the
        # server level do not inherit into blocks that declare their own.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
        try_files $uri $uri/ =404;
    }

    # Custom 404 from the static export (PRD §14.11).
    error_page 404 /404.html;

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}

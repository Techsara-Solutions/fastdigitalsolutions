# Site server block for the Fast Digital Solutions static export.
# Installed to /etc/nginx/conf.d/fastdigitalsolutions.conf by deploy/setup-ec2.sh.
#
# `root` points at a symlink that the deploy pipeline re-points atomically, so a
# release switch is instantaneous and needs no nginx reload.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Replace `_` with the real hostnames once the domain is purchased, e.g.
    #   server_name fastdigitalsolutions.com www.fastdigitalsolutions.com;
    # then run certbot --nginx to add TLS (see docs/DEPLOYMENT.md).
    server_name _;

    root /var/www/fastdigitalsolutions/current;
    index index.html;

    # Applies to responses from blocks that add no headers of their own.
    include /etc/nginx/security-headers.conf;

    # Build assets carry a content hash in their filename, so they can never go
    # stale — cache them for a year.
    location /_next/static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Self-hosted fonts are fingerprinted by the build in the same way.
    location ~* \.woff2$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML must revalidate, otherwise a deployment would not be visible until
    # visitors' caches expired.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # `$uri/` resolves /services/ to /services/index.html, which is the
        # layout produced by the export's trailingSlash: true setting.
        try_files $uri $uri/ =404;
    }

    # Custom 404 from the static export (PRD §14.11). Deliberately NOT marked
    # `internal`, so the deployment health check can request it directly.
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}

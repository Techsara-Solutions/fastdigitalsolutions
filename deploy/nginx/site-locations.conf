# Shared document root and location blocks, installed to
# /etc/nginx/site-locations.conf and included by BOTH the port 80 and port 443
# server blocks in conf.d/fastdigitalsolutions.conf.
#
# Kept in one file so the two listeners cannot drift apart — a caching or
# security rule fixed for HTTPS but forgotten for HTTP would be a silent hole.

# Points at a symlink that the deploy pipeline re-points atomically, so a
# release switch is instantaneous and needs no nginx reload.
root /var/www/fastdigitalsolutions/current;
index index.html;

# Applies to responses from blocks that add no headers of their own.
include /etc/nginx/security-headers.conf;

# Build assets carry a content hash in their filename, so they can never go
# stale — cache them for a year.
location /_next/static/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Self-hosted fonts are fingerprinted by the build in the same way.
location ~* \.woff2$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# HTML must revalidate, otherwise a deployment would not be visible until
# visitors' caches expired.
location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    # `$uri/` resolves /services/ to /services/index.html, which is the layout
    # produced by the export's trailingSlash: true setting.
    try_files $uri $uri/ =404;
}

# Custom 404 from the static export (PRD §14.11). Deliberately NOT marked
# `internal`, so the deployment health check can request it directly.
error_page 404 /404.html;
location = /404.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# Never serve dotfiles.
location ~ /\. {
    deny all;
}

name: CI

# Runs on pull requests, and is called by deploy.yml as the required gate
# before anything reaches production.
#
# There is deliberately NO `push` trigger. A push to a branch that has an open
# pull request fires both `push` and `pull_request` for the same commit, and
# because the two events report different values for github.ref they land in
# different concurrency groups and neither cancels the other — so every change
# ran the whole suite twice and billed twice the Actions minutes.
#
# `pull_request` alone is sufficient and slightly better:
#   - pushing more commits to an open PR still re-runs everything (the
#     `synchronize` event), so feedback while iterating is unchanged;
#   - it tests the MERGE RESULT rather than the branch in isolation, which is
#     the thing actually being proposed;
#   - `main` is covered by deploy.yml calling this workflow via workflow_call.
#
# The trade-off: a push to a branch with no open PR gets no CI. That is fine
# here — work reaches production only through hd-dev → dev → main pull
# requests, each of which is checked.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The production build published by the `quality` job. deploy.yml downloads
  # this exact artifact instead of rebuilding, so what ships is what was tested.
  BUILD_ARTIFACT_NAME: site-build

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Content validation + static build
        # Mirror the deploy workflow's environment exactly. Unset repository
        # variables arrive as empty strings, and building without them here
        # once let a blank-URL crash reach production while CI stayed green.
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL }}
          NEXT_PUBLIC_CONTACT_API_TIMEOUT_MS: ${{ vars.NEXT_PUBLIC_CONTACT_API_TIMEOUT_MS }}
        run: npm run build

      - name: Publish the tested build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Built separately from the published artifact: this build deliberately
      # bakes in a mock contact endpoint, so it must never be deployed.
      - name: Build with mocked contact API (e2e)
        run: npm run build:e2e

      - name: Playwright tests (navigation, contact form states, axe-core)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
